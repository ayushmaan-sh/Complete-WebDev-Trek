<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning CORS</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.7.6/axios.min.js"></script>
    <script>
        async function sendRequest(){
            const valuesOfA = document.getElementById('a').value;
            const valuesOfB = document.getElementById('b').value;
            let answer = document.getElementById('answer');
            const response = await axios.post('http://localhost:3000/sum', {
                a: valuesOfA,
                b: valuesOfB
            })
            console.log(response.data.answer);
            answer.innerHTML = `Sum is ${response.data.answer}`;
        }
    </script>
</head>
<body>
    <h1>CORS</h1>

    <input placeholder="First Value" type="text" name="" id="a"></input>
    <input placeholder="Second Value" type="text" name="" id="b"></input>

    <button onclick="sendRequest()">Find Sum</button>

    <div id="answer"></div>
</body>

</html>
